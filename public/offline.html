<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão · Meu Rim</title>
    <style>
      :root { --teal: #087b82; --bg: #f7fafb; --text: #0b2f45; --muted: #6d8190; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text);
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
      .card { text-align: center; max-width: 340px; }
      .mark { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 18px;
        background: linear-gradient(135deg, #087b82, #075e70); display: grid; place-items: center; }
      .mark span { width: 34px; height: 26px; display: flex; gap: 4px; }
      .mark i { flex: 1; background: #fff; border-radius: 40% 40% 45% 45%; opacity: .97; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
      button { background: var(--teal); color: #fff; border: 0; border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"><span><i></i><i></i></span></div>
      <h1>Você está sem conexão</h1>
      <p>Verifique sua internet para continuar usando o Meu Rim. Seus dados ficam salvos com segurança.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
